name: NiyamTrace CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  NIYAMTRACE_SECRETS_BACKEND: env
  LLM_BACKEND: gemini

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        working-directory: niyamtrace
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        working-directory: niyamtrace
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: niyamtrace
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        working-directory: niyamtrace
        run: pytest tests/unit/ -v --tb=short
      - name: Run integration tests
        working-directory: niyamtrace
        run: pytest tests/integration/ -v --tb=short
      - name: Run regression tests
        working-directory: niyamtrace
        run: pytest tests/regression/ -v --tb=short
      - name: Run replay tests
        working-directory: niyamtrace
        run: pytest tests/replay/ -v --tb=short

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    # Only run benchmark on push to main (not on every PR — costs API quota)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: niyamtrace
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run NiyamTrace-Bench
        working-directory: niyamtrace
        run: |
          # Gate failure if accuracy < 80%; --limit 20 to stay within free-tier quota
          python -m packages.bench.runner --threshold 0.80 --limit 20
      - name: Upload Benchmark Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: |
            niyamtrace/data/benchmark/benchmark_report.html
            niyamtrace/data/benchmark/benchmark_report.json
