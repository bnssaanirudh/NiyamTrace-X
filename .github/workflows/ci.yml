name: NiyamTrace CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  NIYAMTRACE_SECRETS_BACKEND: env
  LLM_BACKEND: gemini

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        working-directory: niyamtrace
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        working-directory: niyamtrace
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: niyamtrace
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        working-directory: niyamtrace
        run: pytest tests/unit/ -v --tb=short
      - name: Run integration tests
        working-directory: niyamtrace
        run: pytest tests/integration/ -v --tb=short
      - name: Run regression tests
        working-directory: niyamtrace
        run: pytest tests/regression/ -v --tb=short
      - name: Run replay tests
        working-directory: niyamtrace
        run: pytest tests/replay/ -v --tb=short
      - name: Run security tests
        working-directory: niyamtrace
        run: pytest tests/security/ -v --tb=short

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    # Only run benchmark on push to main (not on every PR — costs API quota)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: niyamtrace
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run NiyamTrace-Bench
        working-directory: niyamtrace
        run: |
          # Gate failure if accuracy < 80%; --limit 20 to stay within free-tier quota
          python -m packages.bench.runner --threshold 0.80 --limit 20
      - name: Upload Benchmark Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: |
            niyamtrace/data/benchmark/benchmark_report.html
            niyamtrace/data/benchmark/benchmark_report.json

  paper-evidence:
    name: Paper evidence integrity and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test evidence utilities
        working-directory: niyamtrace
        run: |
          python -m pip install pytest
          python -m pytest tests/unit/test_paper_tools.py tests/unit/test_notebook_evidence_audit.py -q --confcutdir=tests/unit
      - name: Validate registered paper artifact files
        run: |
          python niyamtrace/scripts/paper_audit.py --repo-root . --register paper/reproducibility/2026-11-02/EVIDENCE_REGISTER.csv --output-dir paper_audit_out
      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-evidence-audit
          path: paper_audit_out/

  notebook-evidence-audit:
    name: Complete static notebook and result archive audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout audit scripts (this PR)
        uses: actions/checkout@v4
      - name: Checkout unmerged October recovery evidence
        uses: actions/checkout@v4
        with:
          ref: archive/niyamtrace-oct-2026-research-recovery
          path: recovery_snapshot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit all recovered notebook JSON and result paths
        run: |
          python niyamtrace/scripts/notebook_evidence_audit.py \
            --repo-root recovery_snapshot \
            --output-dir notebook_audit_out \
            --source-ref archive/niyamtrace-oct-2026-research-recovery \
            --crc-limit-mib 32
      - name: Identify the unreadable public Notebook 23 encoding
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("recovery_snapshot/research/notebooks/23_Full_Pipeline_Public_Controlled.ipynb")
          data = path.read_bytes()
          print("path:", path)
          print("bytes:", len(data))
          print("first_32_hex:", data[:32].hex())
          for codec in ("utf-8-sig", "utf-16", "utf-16-le", "utf-16-be"):
              try:
                  decoded = data.decode(codec)
                  ok = isinstance(json.loads(decoded), dict)
                  print(f"{codec} JSON object: {ok}")
              except (UnicodeError, ValueError):
                  print(f"{codec} not valid notebook JSON")
          PY
      - name: Upload per-notebook and per-result integrity inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-notebook-and-result-audit
          path: notebook_audit_out/

  reproduce-frozen-evidence:
    name: Recompute retained manuscript results (no inference)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archive/niyamtrace-oct-2026-research-recovery
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract curated archived scientific evidence
        run: python -m zipfile -e research/paper_evidence/NiyamTraceX_Manuscript_Evidence_2026-10-28.zip reproduced_evidence
      - name: Verify frozen paired native and control cases
        run: python -X utf8 reproduced_evidence/Analysis/reproduce_results.py
      - name: Verify historical stress broker and open-weight cases
        run: python -X utf8 reproduced_evidence/Analysis/reproduce_history.py
      - name: Verify NTX24B reference replay aggregates
        run: python -X utf8 research/paper_evidence/verify_ntx24b.py
