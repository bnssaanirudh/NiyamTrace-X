name: NiyamTrace CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
        
    - name: Run unit tests
      run: |
        pytest tests/
        
    - name: Run NiyamTrace-Bench (Week 8)
      run: |
        # Gate failure if accuracy < 80%
        python -m apps.benchmark.run --threshold 0.80
        
    - name: Upload Benchmark Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: benchmark-report
        path: |
          data/benchmark/benchmark_report.html
          data/benchmark/benchmark_report.json
