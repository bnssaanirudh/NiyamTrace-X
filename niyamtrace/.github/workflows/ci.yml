name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: uv pip install --system -e ".[dev]"

    - name: Ruff lint check
      run: uv run ruff check .

    - name: Ruff format check
      run: uv run ruff format --check .

    - name: Upload ruff summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ruff-summary
        path: |
          .ruff_cache/

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: uv pip install --system -e ".[dev]"

    - name: Set up Environment
      run: cp .env.example .env

    - name: Run Unit Tests
      run: |
        uv run pytest tests/unit/ -v --tb=short \
          --junitxml=reports/junit-unit.xml \
          -q 2>&1 | tee reports/unit-tests.txt

    - name: Run Integration Tests
      run: |
        uv run pytest tests/integration/ -v --tb=short \
          --junitxml=reports/junit-integration.xml \
          -q 2>&1 | tee reports/integration-tests.txt

    - name: Run Regression Tests
      run: |
        uv run pytest tests/regression/ -v --tb=short \
          --junitxml=reports/junit-regression.xml \
          -q 2>&1 | tee reports/regression-tests.txt

    - name: Run Replay Tests
      run: |
        if [ -d "tests/replay" ] && [ "$(ls -A tests/replay)" ]; then
          uv run pytest tests/replay/ -v --tb=short \
            --junitxml=reports/junit-replay.xml \
            -q 2>&1 | tee reports/replay-tests.txt
        else
          echo "No replay tests yet." | tee reports/replay-tests.txt
        fi

    - name: Run Security Tests
      run: |
        uv run pytest tests/security/ -v --tb=short \
          --junitxml=reports/junit-security.xml \
          -q 2>&1 | tee reports/security-tests.txt

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-reports
        path: reports/

  benchmark:
    name: Benchmark (post-test)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: uv pip install --system -e ".[dev]"

    - name: Set up Environment
      run: cp .env.example .env

    - name: Run Benchmark (smoke — 10 cases)
      run: |
        uv run python apps/benchmark/run.py \
          --max-cases 10 \
          --output reports/benchmark-summary.json \
          2>&1 | tee reports/benchmark-run.txt || echo "Benchmark failed or not yet fully configured — INFRA_FAILURE recorded" | tee reports/benchmark-run.txt

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-summary
        path: reports/
