version: "3.8"

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: niyamtrace-gateway
    ports:
      - "8000:8000"
    volumes:
      - niyamtrace_traces:/app/traces
    env_file:
      - .env
    environment:
      - NIYAMTRACE_LOG_LEVEL=INFO

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: niyamtrace-dashboard
    ports:
      - "8001:8001"
    volumes:
      - niyamtrace_traces:/app/traces
    depends_on:
      - gateway

volumes:
  niyamtrace_traces:
    description: Shared volume for Bronze/Silver trace files
